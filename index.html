<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>國道路況儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .highway-sign {
            background-color: #007A3D;
            border: 2px solid #FFFFFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col p-3 justify-between select-none">

    <!-- 頂部資訊列：滿版滿幅，突出顯示車速與當前里程 -->
    <header class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 flex justify-between items-center shadow-xl mb-3">
        <div class="flex items-center space-x-3">
            <div class="bg-[#007A3D] border border-white/80 text-white font-black px-3 py-1 rounded-lg text-base tracking-wider shadow">
                國1
            </div>
            <div>
                <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">目前位置</div>
                <div id="current-km" class="text-3xl font-black text-emerald-400 font-mono">--.- K</div>
            </div>
        </div>
        <div class="text-right flex items-baseline space-x-1 bg-slate-900 px-4 py-1.5 rounded-xl border border-slate-700">
            <span id="current-speed" class="text-3xl font-black text-white font-mono">0</span>
            <span class="text-xs font-bold text-slate-400">km/h</span>
        </div>
    </header>

    <!-- 主體：滿版放大路線軸 (下一個閘道在最上方) -->
    <main class="flex-1 bg-[#1e293b]/90 border border-slate-700/80 rounded-2xl p-4 shadow-2xl flex flex-col justify-between relative overflow-hidden">
        
        <!-- 頂部狀態列 -->
        <div class="text-xs font-bold text-slate-400 tracking-wider border-b border-slate-700/60 pb-2 flex justify-between items-center">
            <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>前方即時路況</span>
            <span id="direction-tag" class="bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-0.5 rounded-md text-xs font-bold">南下</span>
        </div>

        <!-- 動態路線與汽車位置主區域 (全高延展) -->
        <div id="timeline-container" class="relative flex-1 my-3 pl-8 flex flex-col justify-between">
            <div class="text-center text-slate-500 my-auto text-base">搜尋 GPS 定位中...</div>
        </div>

    </main>

    <!-- 頁尾狀態列 -->
    <footer class="text-center text-xs text-slate-500 pt-2 pb-1">
        <span id="status-text">請允許位置存取以啟動即時追蹤</span>
    </footer>

    <script>
        const highwayData = [
            { "id": "34", "freeway": "國道1號", "name": "高公局", "direction": "S", "km": 34.1, "lat": 25.053, "lng": 121.430, "trafficSpeed": 88 },
            { "id": "35", "freeway": "國道1號", "name": "泰山轉接", "direction": "S", "km": 35.8, "lat": 25.057, "lng": 121.420, "trafficSpeed": 35 },
            { "id": "41", "freeway": "國道1號", "name": "林口", "direction": "S", "km": 41.5, "lat": 25.068, "lng": 121.364, "trafficSpeed": 62 },
            { "id": "49", "freeway": "國道1號", "name": "桃園", "direction": "S", "km": 49.1, "lat": 25.034, "lng": 121.298, "trafficSpeed": 92 },
            { "id": "52", "freeway": "國道1號", "name": "機場系統", "direction": "S", "km": 52.5, "lat": 25.031, "lng": 121.282, "trafficSpeed": 85 },
            { "id": "57", "freeway": "國道1號", "name": "中壢", "direction": "S", "km": 57.0, "lat": 24.981, "lng": 121.242, "trafficSpeed": 90 },
            
            { "id": "57N", "freeway": "國道1號", "name": "中壢", "direction": "N", "km": 57.0, "lat": 24.981, "lng": 121.242, "trafficSpeed": 90 },
            { "id": "52N", "freeway": "國道1號", "name": "機場系統", "direction": "N", "km": 52.5, "lat": 25.031, "lng": 121.282, "trafficSpeed": 85 },
            { "id": "49N", "freeway": "國道1號", "name": "桃園", "direction": "N", "km": 49.1, "lat": 25.034, "lng": 121.298, "trafficSpeed": 92 },
            { "id": "41N", "freeway": "國道1號", "name": "林口", "direction": "N", "km": 41.5, "lat": 25.068, "lng": 121.364, "trafficSpeed": 62 },
            { "id": "35N", "freeway": "國道1號", "name": "泰山轉接", "direction": "N", "km": 35.8, "lat": 25.057, "lng": 121.420, "trafficSpeed": 35 },
            { "id": "34N", "freeway": "國道1號", "name": "高公局", "direction": "N", "km": 34.1, "lat": 25.053, "lng": 121.430, "trafficSpeed": 88 }
        ];

        function getDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        let lastLat = null;
        let lastLng = null;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let heading = position.coords.heading;
                    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

                    document.getElementById("current-speed").innerText = speed;

                    if ((heading === null || isNaN(heading)) && lastLat !== null) {
                        const dLng = lng - lastLng;
                        const dLat = lat - lastLat;
                        if (Math.abs(dLng) > 0.0001 || Math.abs(dLat) > 0.0001) {
                            heading = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
                        }
                    }
                    lastLat = lat;
                    lastLng = lng;

                    let currentDirection = "S";
                    if (heading !== null && !isNaN(heading)) {
                        currentDirection = (heading >= 90 && heading <= 270) ? "S" : "N";
                    }

                    document.getElementById("direction-tag").innerText = currentDirection === "S" ? "南下" : "北上";

                    const activeData = highwayData.filter(item => item.direction === currentDirection);
                    let nearest = activeData[0];
                    let minDistance = getDistanceKM(lat, lng, nearest.lat, nearest.lng);

                    activeData.forEach(item => {
                        const d = getDistanceKM(lat, lng, item.lat, item.lng);
                        if (d < minDistance) {
                            minDistance = d;
                            nearest = item;
                        }
                    });

                    let currentKM = nearest.km;
                    if (currentDirection === "S") {
                        currentKM = (lat < nearest.lat) ? (nearest.km + minDistance) : (nearest.km - minDistance);
                    } else {
                        currentKM = (lat > nearest.lat) ? (nearest.km - minDistance) : (nearest.km + minDistance);
                    }
                    currentKM = Math.max(0, currentKM);

                    document.getElementById("current-km").innerText = `${currentKM.toFixed(1)} K`;
                    document.getElementById("status-text").innerText = "GPS 定位正常運作中";

                    let upcoming = [];
                    if (currentDirection === "S") {
                        upcoming = activeData.filter(item => item.km > currentKM).sort((a, b) => a.km - b.km);
                    } else {
                        upcoming = activeData.filter(item => item.km < currentKM).sort((a, b) => b.km - a.km);
                    }

                    renderTimelineUI(upcoming, currentKM, activeData);
                },
                (error) => {
                    document.getElementById("status-text").innerText = "無法取得 GPS 定位";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        function getTrafficBadge(speed) {
            if (speed >= 80) {
                return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-xs font-bold">${speed} km/h</span>`;
            } else if (speed >= 40) {
                return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded text-xs font-bold">${speed} km/h (車多)</span>`;
            } else {
                return `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded text-xs font-bold animate-pulse">${speed} km/h (壅塞)</span>`;
            }
        }

        function renderTimelineUI(upcoming, currentKM, activeData) {
            const container = document.getElementById("timeline-container");
            if (upcoming.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 my-auto text-base">前方無更多閘道資訊</div>`;
                return;
            }

            // 最上方的下一個閘道 (Next Exit)
            const nextExit = upcoming[0];
            // 最下方的剛剛經過閘道 (Previous Exit)
            const prevExit = activeData.filter(i => (activeData[0].direction === 'S' ? i.km <= currentKM : i.km >= currentKM)).pop() || activeData[0];

            // 正確計算車子進度 (由下向上移動)：
            // 當前位置離上個閘道越遠，進度百分比越高 (0% 靠近下方剛經過閘道，100% 靠近上方下一個閘道)
            const totalSegmentKM = Math.abs(nextExit.km - prevExit.km) || 1;
            const progressKM = Math.abs(currentKM - prevExit.km);
            let progressPercent = Math.min(100, Math.max(0, (progressKM / totalSegmentKM) * 100));

            // 車子定位點（下邊距由 10% 到 90% 之間平滑上升）
            const carBottomPosition = 10 + (progressPercent * 0.8);

            // 前方預覽顯示（最多顯示上方 3 個未來的閘道 + 最底下 1 個剛過的閘道）
            const displayUpcoming = upcoming.slice(0, 3);

            let html = `
                <!-- 垂直貫穿路線軌道 -->
                <div class="absolute left-3 top-2 bottom-2 w-1.5 bg-slate-700 rounded-full"></div>

                <!-- 🚗 車子動態 Icon (由下往上移動，靠近頂部下一個閘道) -->
                <div class="absolute left-0.5 w-6 h-6 bg-amber-400 border-2 border-white rounded-full flex items-center justify-center text-black text-xs shadow-lg shadow-amber-400/50 transition-all duration-1000 z-20" 
                     style="bottom: ${carBottomPosition}%;">
                    🚗
                </div>
            `;

            // 渲染前方閘道 (顯示順序：最遠的在最上方 $\rightarrow$ 下一個閘道在靠近上方處)
            displayUpcoming.reverse().forEach((item, revIndex) => {
                const index = displayUpcoming.length - 1 - revIndex;
                const dist = Math.abs(item.km - currentKM).toFixed(1);
                const estTime = Math.ceil(dist * 0.7);
                const isNext = index === 0;

                html += `
                    <div class="relative flex items-center justify-between z-10 my-2">
                        <!-- 路線軸節點標示 -->
                        <div class="absolute -left-8 w-4 h-4 rounded-full ${isNext ? 'bg-amber-400 ring-4 ring-amber-400/30 animate-pulse' : 'bg-slate-600'}"></div>
                        
                        <!-- 國道指示牌與路況 -->
                        <div class="flex items-center space-x-2">
                            <div class="highway-sign text-white px-3.5 py-2 rounded-xl font-bold flex items-center space-x-2 shadow-lg ${isNext ? 'scale-105 border-amber-300' : 'opacity-85'}">
                                <span class="text-sm font-black border-r border-white/40 pr-2 font-mono">${item.id.replace('N','')}</span>
                                <span class="text-lg font-black tracking-wider">${item.name}</span>
                            </div>
                            ${getTrafficBadge(item.trafficSpeed)}
                        </div>

                        <!-- 距離與預估時間 -->
                        <div class="text-right">
                            <div class="text-xl font-black ${isNext ? 'text-amber-400 font-mono' : 'text-slate-200 font-mono'}">${dist} <span class="text-xs text-slate-400">km</span></div>
                            <div class="text-xs font-bold text-slate-400">約 ${estTime} 分</div>
                        </div>
                    </div>
                `;
            });

            // 最下方：剛經過的交流道 (作為參考基準)
            if (prevExit && prevExit.id !== nextExit.id) {
                html += `
                    <div class="relative flex items-center justify-between opacity-50 z-10 pt-4 border-t border-slate-700/50">
                        <div class="absolute -left-8 w-3 h-3 rounded-full bg-slate-600"></div>
                        <div class="flex items-center space-x-2">
                            <div class="bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1 rounded-lg text-sm font-bold">
                                ${prevExit.name} (已過)
                            </div>
                        </div>
                        <div class="text-xs font-bold text-slate-400 font-mono">${prevExit.km.toFixed(1)} K</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        requestWakeLock();
    </script>
</body>
</html>
