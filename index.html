<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Web App / PWA 全螢幕設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="國道儀表板">
    <title>國道閘道儀表板</title>
    <!-- Tailwind CSS 快速佈局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col p-4 justify-between select-none">

    <!-- 頂部：當前位置與車速 -->
    <header class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex justify-between items-center shadow-lg">
        <div>
            <div class="text-xs text-gray-400 font-bold uppercase tracking-wider">目前位置</div>
            <div id="current-km" class="text-4xl font-extrabold text-green-400 font-mono">--.- K</div>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-400 font-bold uppercase tracking-wider">時速</div>
            <div id="current-speed" class="text-3xl font-bold text-white">0 <span class="text-sm font-normal text-gray-400">km/h</span></div>
        </div>
    </header>

    <!-- 中間核心：下一個閘道重點提示 -->
    <main class="my-auto py-4">
        <div class="bg-gradient-to-b from-blue-950 to-gray-900 border-2 border-blue-500/50 rounded-3xl p-6 text-center shadow-2xl relative overflow-hidden">
            <div class="text-orange-400 text-xs font-bold tracking-widest uppercase mb-1">NEXT EXIT / 下一個閘道</div>
            <div id="next-name" class="text-3xl font-black text-white my-2">搜尋 GPS 定位中...</div>
            
            <div class="flex justify-center items-baseline my-2">
                <span id="next-distance" class="text-7xl font-black text-yellow-400 font-mono tracking-tight">--.-</span>
                <span class="text-2xl font-bold text-yellow-400 ml-2">公里</span>
            </div>
            
            <div id="next-km" class="text-gray-400 text-sm">請確定已允許 GPS 定位權限</div>
        </div>
    </main>

    <!-- 下半部：未來閘道預覽 -->
    <footer class="bg-gray-900 border border-gray-800 rounded-2xl p-4 max-h-52 flex flex-col">
        <div class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-2">前方閘道預覽</div>
        <div id="upcoming-list" class="overflow-y-auto space-y-2 pr-1">
            <div class="text-sm text-gray-500 text-center py-2">尚未取得座標</div>
        </div>
    </footer>

    <!-- 邏輯腳本 -->
    <script>
        // 內嵌全台主要國道交流道資料 (無需外部 freeways.json 檔案)
        const highwayData = [
            { "id": "N1-001", "freeway": "國道1號", "name": "基隆端", "direction": "S", "km": 0.0, "lat": 25.128, "lng": 121.740 },
            { "id": "N1-025", "freeway": "國道1號", "name": "台北", "direction": "S", "km": 25.1, "lat": 25.071, "lng": 121.516 },
            { "id": "N1-033", "freeway": "國道1號", "name": "五股", "direction": "S", "km": 33.1, "lat": 25.060, "lng": 121.438 },
            { "id": "N1-052", "freeway": "國道1號", "name": "機場系統", "direction": "S", "km": 52.5, "lat": 25.031, "lng": 121.282 },
            { "id": "N1-069", "freeway": "國道1號", "name": "楊梅", "direction": "S", "km": 69.2, "lat": 24.908, "lng": 121.147 },
            { "id": "N1-083", "freeway": "國道1號", "name": "湖口", "direction": "S", "km": 83.5, "lat": 24.896, "lng": 121.045 },
            { "id": "N1-091", "freeway": "國道1號", "name": "竹北", "direction": "S", "km": 91.0, "lat": 24.839, "lng": 121.011 },
            { "id": "N1-095", "freeway": "國道1號", "name": "新竹", "direction": "S", "km": 95.5, "lat": 24.798, "lng": 120.997 },
            { "id": "N1-110", "freeway": "國道1號", "name": "頭份", "direction": "S", "km": 110.4, "lat": 24.689, "lng": 120.908 },
            { "id": "N1-178", "freeway": "國道1號", "name": "台中", "direction": "S", "km": 178.6, "lat": 24.170, "lng": 120.635 },
            { "id": "N1-367", "freeway": "國道1號", "name": "高雄", "direction": "S", "km": 367.0, "lat": 22.628, "lng": 120.332 },
            
            { "id": "N1-367N", "freeway": "國道1號", "name": "高雄", "direction": "N", "km": 367.0, "lat": 22.628, "lng": 120.332 },
            { "id": "N1-178N", "freeway": "國道1號", "name": "台中", "direction": "N", "km": 178.6, "lat": 24.170, "lng": 120.635 },
            { "id": "N1-110N", "freeway": "國道1號", "name": "頭份", "direction": "N", "km": 110.4, "lat": 24.689, "lng": 120.908 },
            { "id": "N1-095N", "freeway": "國道1號", "name": "新竹", "direction": "N", "km": 95.5, "lat": 24.798, "lng": 120.997 },
            { "id": "N1-091N", "freeway": "國道1號", "name": "竹北", "direction": "N", "km": 91.0, "lat": 24.839, "lng": 121.011 },
            { "id": "N1-083N", "freeway": "國道1號", "name": "湖口", "direction": "N", "km": 83.5, "lat": 24.896, "lng": 121.045 },
            { "id": "N1-069N", "freeway": "國道1號", "name": "楊梅", "direction": "N", "km": 69.2, "lat": 24.908, "lng": 121.147 },
            { "id": "N1-052N", "freeway": "國道1號", "name": "機場系統", "direction": "N", "km": 52.5, "lat": 25.031, "lng": 121.282 },
            { "id": "N1-033N", "freeway": "國道1號", "name": "五股", "direction": "N", "km": 33.1, "lat": 25.060, "lng": 121.438 },
            { "id": "N1-025N", "freeway": "國道1號", "name": "台北", "direction": "N", "km": 25.1, "lat": 25.071, "lng": 121.516 },
            { "id": "N1-001N", "freeway": "國道1號", "name": "基隆端", "direction": "N", "km": 0.0, "lat": 25.128, "lng": 121.740 }
        ];

        // 計算兩點經緯度距離 (Haversine Formula，單位：公里)
        function getDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // 啟動 GPS 監聽
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const heading = position.coords.heading; // 行進角度 (0~360度)
                    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

                    // 更新車速
                    document.getElementById("current-speed").innerHTML = `${speed} <span class="text-sm font-normal text-gray-400">km/h</span>`;

                    // A. 自動判定方向：預設為南下 (S)，若 heading 偏向 270~360 或 0~90 則判定為北上 (N)
                    let currentDirection = "S"; 
                    if (heading !== null && !isNaN(heading)) {
                        currentDirection = (heading > 90 && heading < 270) ? "S" : "N";
                    }

                    // B. 過濾同方向交流道
                    const activeData = highwayData.filter(item => item.direction === currentDirection);
                    if (activeData.length === 0) return;

                    // C. 尋找最近交流道推算當前里程
                    let nearest = activeData[0];
                    let minDistance = getDistanceKM(lat, lng, nearest.lat, nearest.lng);

                    activeData.forEach(item => {
                        const d = getDistanceKM(lat, lng, item.lat, item.lng);
                        if (d < minDistance) {
                            minDistance = d;
                            nearest = item;
                        }
                    });

                    // 推估當前公里標 (南下里程增加，北上里程減少)
                    const currentKM = (currentDirection === "S") ? (nearest.km + minDistance) : (nearest.km - minDistance);
                    document.getElementById("current-km").innerText = `${currentKM.toFixed(1)} K`;

                    // D. 篩選前方閘道
                    let upcoming = [];
                    if (currentDirection === "S") {
                        upcoming = activeData.filter(item => item.km > currentKM)
                                             .sort((a, b) => a.km - b.km);
                    } else {
                        upcoming = activeData.filter(item => item.km < currentKM)
                                             .sort((a, b) => b.km - a.km);
                    }

                    // E. 更新介面
                    if (upcoming.length > 0) {
                        const next = upcoming[0];
                        const distToNext = Math.abs(next.km - currentKM);

                        document.getElementById("next-name").innerText = `${next.freeway || ''} ${next.name}`;
                        document.getElementById("next-distance").innerText = distToNext.toFixed(1);
                        document.getElementById("next-km").innerText = `預計於 ${next.km.toFixed(1)} K 處駛離 (${currentDirection === "S" ? '南下' : '北上'})`;

                        // 渲染前方列表 (顯示前 5 個)
                        const listHtml = upcoming.slice(1, 6).map(item => `
                            <div class="flex justify-between items-center bg-gray-800/60 p-2.5 rounded-lg text-sm">
                                <span class="font-bold text-gray-200">${item.freeway || ''} ${item.name}</span>
                                <span class="font-mono text-gray-400">${item.km.toFixed(1)} K</span>
                            </div>
                        `).join('');
                        document.getElementById("upcoming-list").innerHTML = listHtml || `<div class="text-xs text-gray-500 text-center py-2">前方已無預設閘道</div>`;
                    } else {
                        document.getElementById("next-name").innerText = "前方無更多閘道";
                        document.getElementById("next-distance").innerText = "0.0";
                        document.getElementById("next-km").innerText = "已抵達終點或離開國道範圍";
                    }
                },
                (error) => {
                    console.error(error);
                    document.getElementById("next-name").innerText = "定位授權失敗";
                    document.getElementById("next-km").innerText = "請於瀏覽器設定中開啟 GPS 位置存取權限";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        } else {
            alert("您的裝置或瀏覽器不支援 GPS 定位");
        }

        // 螢幕常亮防休眠 (Wake Lock)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock 失敗:", err);
            }
        }
        requestWakeLock();
    </script>
</body>
</html>
