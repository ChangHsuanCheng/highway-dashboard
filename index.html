<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>國道路況儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .highway-sign {
            background-color: #007A3D;
            border: 2px solid #FFFFFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col p-3 justify-between select-none">

    <!-- 頂部資訊列 -->
    <header class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 flex justify-between items-center shadow-xl mb-3">
        <div class="flex items-center space-x-3">
            <div class="bg-[#007A3D] border border-white/80 text-white font-black px-3 py-1 rounded-lg text-base tracking-wider shadow">
                國1
            </div>
            <div>
                <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">目前位置</div>
                <div id="current-km" class="text-3xl font-black text-emerald-400 font-mono">--.- K</div>
            </div>
        </div>
        <div class="text-right flex items-baseline space-x-1 bg-slate-900 px-4 py-1.5 rounded-xl border border-slate-700">
            <span id="current-speed" class="text-3xl font-black text-white font-mono">0</span>
            <span class="text-xs font-bold text-slate-400">km/h</span>
        </div>
    </header>

    <!-- 主體：極簡路線軸 -->
    <main class="flex-1 bg-[#1e293b]/90 border border-slate-700/80 rounded-2xl p-4 shadow-2xl flex flex-col justify-between relative overflow-hidden">
        
        <!-- 頂部狀態列 -->
        <div class="text-xs font-bold text-slate-400 tracking-wider border-b border-slate-700/60 pb-2 flex justify-between items-center">
            <span class="flex items-center">
                <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                <span id="api-status-text">TDX 即時路況連線中...</span>
            </span>
            <span id="direction-tag" class="bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-0.5 rounded-md text-xs font-bold">南下</span>
        </div>

        <!-- 路線軸主區域 -->
        <div id="timeline-container" class="relative flex-1 my-3 pl-7 flex flex-col justify-between">
            <div class="text-center text-slate-500 my-auto text-base">搜尋 GPS 定位中...</div>
        </div>

    </main>

    <!-- 頁尾狀態列 -->
    <footer class="text-center text-xs text-slate-500 pt-2 pb-1">
        <span id="status-text">請允許位置存取以啟動即時追蹤</span>
    </footer>

    <script>
        // 基礎節點座標資料
        let highwayData = [
            { "id": "34", "freeway": "國道1號", "name": "高公局", "direction": "S", "km": 34.1, "lat": 25.053, "lng": 121.430, "segmentSpeed": 85 },
            { "id": "41", "freeway": "國道1號", "name": "林口", "direction": "S", "km": 41.5, "lat": 25.068, "lng": 121.364, "segmentSpeed": 85 },
            { "id": "49", "freeway": "國道1號", "name": "桃園", "direction": "S", "km": 49.1, "lat": 25.034, "lng": 121.298, "segmentSpeed": 85 },
            { "id": "52", "freeway": "國道1號", "name": "機場系統", "direction": "S", "km": 52.5, "lat": 25.031, "lng": 121.282, "segmentSpeed": 85 },
            { "id": "57", "freeway": "國道1號", "name": "中壢", "direction": "S", "km": 57.0, "lat": 24.981, "lng": 121.242, "segmentSpeed": 85 },
            
            { "id": "57N", "freeway": "國道1號", "name": "中壢", "direction": "N", "km": 57.0, "lat": 24.981, "lng": 121.242, "segmentSpeed": 85 },
            { "id": "52N", "freeway": "國道1號", "name": "機場系統", "direction": "N", "km": 52.5, "lat": 25.031, "lng": 121.282, "segmentSpeed": 85 },
            { "id": "49N", "freeway": "國道1號", "name": "桃園", "direction": "N", "km": 49.1, "lat": 25.034, "lng": 121.298, "segmentSpeed": 85 },
            { "id": "41N", "freeway": "國道1號", "name": "林口", "direction": "N", "km": 41.5, "lat": 25.068, "lng": 121.364, "segmentSpeed": 85 },
            { "id": "34N", "freeway": "國道1號", "name": "高公局", "direction": "N", "km": 34.1, "lat": 25.053, "lng": 121.430, "segmentSpeed": 85 }
        ];

        // 🌐 從 TDX 免費公開 Endpoint 抓取國道一號即時車速 API
        async function fetchRealtimeTraffic() {
            try {
                // TDX 國道 1 號即時路段車速開放 API
                const tdxUrl = "https://tdx.transportdata.tw/api/basic/v2/Road/Highway/Live/Freeway/Freeway1?%24format=JSON";
                const response = await fetch(tdxUrl, { method: 'GET' });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.FreewayLives) {
                        // 更新內部數據
                        document.getElementById("api-status-text").innerText = "TDX 即時路況已同步";
                        document.getElementById("api-status-dot").className = "w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-pulse";
                    }
                } else {
                    document.getElementById("api-status-text").innerText = "使用預設基準路況";
                    document.getElementById("api-status-dot").className = "w-2.5 h-2.5 rounded-full bg-amber-500 mr-2";
                }
            } catch (err) {
                console.log("TDX API 抓取失敗或額度滿額，採用預設路況:", err);
                document.getElementById("api-status-text").innerText = "離線/預設路況模式";
                document.getElementById("api-status-dot").className = "w-2.5 h-2.5 rounded-full bg-slate-500 mr-2";
            }
        }

        // 定期每 2 分鐘更新一次即時路況
        fetchRealtimeTraffic();
        setInterval(fetchRealtimeTraffic, 120000);

        function getDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        let lastLat = null;
        let lastLng = null;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let heading = position.coords.heading;
                    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

                    document.getElementById("current-speed").innerText = speed;

                    if ((heading === null || isNaN(heading)) && lastLat !== null) {
                        const dLng = lng - lastLng;
                        const dLat = lat - lastLat;
                        if (Math.abs(dLng) > 0.0001 || Math.abs(dLat) > 0.0001) {
                            heading = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
                        }
                    }
                    lastLat = lat;
                    lastLng = lng;

                    let currentDirection = "S";
                    if (heading !== null && !isNaN(heading)) {
                        currentDirection = (heading >= 90 && heading <= 270) ? "S" : "N";
                    }

                    document.getElementById("direction-tag").innerText = currentDirection === "S" ? "南下" : "北上";

                    const activeData = highwayData.filter(item => item.direction === currentDirection);
                    let nearest = activeData[0];
                    let minDistance = getDistanceKM(lat, lng, nearest.lat, nearest.lng);

                    activeData.forEach(item => {
                        const d = getDistanceKM(lat, lng, item.lat, item.lng);
                        if (d < minDistance) {
                            minDistance = d;
                            nearest = item;
                        }
                    });

                    let currentKM = nearest.km;
                    if (currentDirection === "S") {
                        currentKM = (lat < nearest.lat) ? (nearest.km + minDistance) : (nearest.km - minDistance);
                    } else {
                        currentKM = (lat > nearest.lat) ? (nearest.km - minDistance) : (nearest.km + minDistance);
                    }
                    currentKM = Math.max(0, currentKM);

                    document.getElementById("current-km").innerText = `${currentKM.toFixed(1)} K`;
                    document.getElementById("status-text").innerText = "GPS 定位正常運作中";

                    let upcoming = [];
                    if (currentDirection === "S") {
                        upcoming = activeData.filter(item => item.km > currentKM).sort((a, b) => a.km - b.km);
                    } else {
                        upcoming = activeData.filter(item => item.km < currentKM).sort((a, b) => b.km - a.km);
                    }

                    renderTimelineUI(upcoming, currentKM, activeData);
                },
                (error) => {
                    document.getElementById("status-text").innerText = "無法取得 GPS 定位";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        function getSpeedTag(speed) {
            if (speed >= 80) {
                return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold">${speed} km/h</span>`;
            } else if (speed >= 50) {
                return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold">${speed} km/h (車多)</span>`;
            } else {
                return `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold animate-pulse">${speed} km/h (壅塞)</span>`;
            }
        }

        function renderTimelineUI(upcoming, currentKM, activeData) {
            const container = document.getElementById("timeline-container");
            if (upcoming.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 my-auto text-base">前方無更多閘道資訊</div>`;
                return;
            }

            const nextExit = upcoming[0];
            const prevExit = activeData.filter(i => (activeData[0].direction === 'S' ? i.km <= currentKM : i.km >= currentKM)).pop() || activeData[0];

            const displayUpcoming = upcoming.slice(0, 3);

            let html = `
                <!-- 垂直貫穿路線軌道 -->
                <div class="absolute left-2.5 top-3 bottom-3 w-1.5 bg-slate-700 rounded-full"></div>
            `;

            displayUpcoming.reverse().forEach((item, revIndex) => {
                const index = displayUpcoming.length - 1 - revIndex;
                const dist = Math.abs(item.km - currentKM).toFixed(1);
                const estTime = Math.ceil(dist * 0.7);
                const isNext = index === 0;

                html += `
                    <div class="relative flex items-center justify-between z-10 my-2">
                        <div class="absolute -left-7 w-4 h-4 rounded-full ${isNext ? 'bg-amber-400 ring-4 ring-amber-400/30' : 'bg-slate-600'}"></div>
                        
                        <div class="flex items-center space-x-2">
                            <div class="highway-sign text-white px-3.5 py-1.5 rounded-xl font-bold flex items-center space-x-2 shadow-lg ${isNext ? 'scale-105 border-amber-300' : 'opacity-85'}">
                                <span class="text-sm font-black border-r border-white/40 pr-2 font-mono">${item.id.replace('N','')}</span>
                                <span class="text-base font-extrabold tracking-wider">${item.name}</span>
                            </div>
                            ${getSpeedTag(item.segmentSpeed || 85)}
                        </div>

                        <div class="text-right">
                            <div class="text-lg font-black ${isNext ? 'text-amber-400 font-mono' : 'text-slate-200 font-mono'}">${dist} <span class="text-xs text-slate-400">km</span></div>
                            <div class="text-xs font-bold text-slate-400">約 ${estTime} 分</div>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="relative flex items-center my-3 z-10">
                    <div class="absolute -left-8 w-5 h-5 bg-emerald-400 border-2 border-white rounded-full shadow-lg shadow-emerald-400/50 animate-pulse"></div>
                    <div class="ml-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-md">
                        📍 目前位置: ${currentKM.toFixed(1)} K
                    </div>
                </div>
            `;

            if (prevExit && prevExit.id !== nextExit.id) {
                html += `
                    <div class="relative flex items-center justify-between opacity-50 z-10 pt-2 border-t border-slate-700/50">
                        <div class="absolute -left-7 w-3 h-3 rounded-full bg-slate-600"></div>
                        <div class="bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1 rounded-lg text-xs font-bold">
                            ${prevExit.name} (已過)
                        </div>
                        <div class="text-xs font-bold text-slate-400 font-mono">${prevExit.km.toFixed(1)} K</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        requestWakeLock();
    </script>
</body>
</html>
