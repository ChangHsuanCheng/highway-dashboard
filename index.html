<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>全自動國道與快速道路儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .highway-sign {
            background-color: #007A3D;
            border: 2px solid #FFFFFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
        .express-sign {
            background-color: #C00000;
            border: 2px solid #FFFFFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col p-3 justify-between select-none">

    <!-- 頂部資訊列：道路徽章 + 當前 K 數 + 車速 -->
    <header class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 flex justify-between items-center shadow-xl mb-3">
        <div class="flex items-center space-x-3">
            <div id="route-badge" class="bg-[#007A3D] text-white font-black px-3 py-1 rounded-xl text-base tracking-wider shadow border border-white/80">
                國1
            </div>
            <div>
                <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wider flex items-center">
                    目前位置 <span id="auto-route-tag" class="ml-1 text-[9px] text-emerald-400 border border-emerald-500/40 px-1 rounded">自動辨識</span>
                </div>
                <div id="current-km" class="text-3xl font-black text-emerald-400 font-mono">--.- K</div>
            </div>
        </div>
        <div class="text-right flex items-baseline space-x-1 bg-slate-900 px-4 py-1.5 rounded-xl border border-slate-700">
            <span id="current-speed" class="text-3xl font-black text-white font-mono">0</span>
            <span class="text-xs font-bold text-slate-400">km/h</span>
        </div>
    </header>

    <!-- 主體：極簡路線軸 -->
    <main class="flex-1 bg-[#1e293b]/90 border border-slate-700/80 rounded-2xl p-4 shadow-2xl flex flex-col justify-between relative overflow-hidden">
        
        <!-- 頂部狀態列 -->
        <div class="text-xs font-bold text-slate-400 tracking-wider border-b border-slate-700/60 pb-2 flex justify-between items-center">
            <span class="flex items-center">
                <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                <span id="api-status-text">TDX 即時路況同步中...</span>
            </span>
            <span id="direction-tag" class="bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-0.5 rounded-md text-xs font-bold">自動辨識方向</span>
        </div>

        <!-- 路線軸主區域 -->
        <div id="timeline-container" class="relative flex-1 my-3 flex flex-col justify-between">
            <div class="text-center text-slate-500 my-auto text-base">搜尋 GPS 定位中...</div>
        </div>

    </main>

    <!-- 模擬行車控制選單面板 (彈出式) -->
    <div id="sim-panel" class="hidden my-2 bg-slate-800 border border-amber-500/50 rounded-xl p-3 text-xs space-y-2">
        <div class="font-bold text-amber-400 flex justify-between items-center">
            <span>⚙️ 模擬參數設定</span>
            <span class="text-[10px] text-slate-400">測試模式開啟中</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
            <div>
                <label class="text-slate-400 block mb-1">道路</label>
                <select id="sim-route" class="bg-slate-900 text-white p-1.5 rounded border border-slate-700 w-full font-bold">
                    <option value="國1">國1</option>
                    <option value="國3">國3</option>
                    <option value="台64">台64</option>
                </select>
            </div>
            <div>
                <label class="text-slate-400 block mb-1">方向</label>
                <select id="sim-dir" class="bg-slate-900 text-white p-1.5 rounded border border-slate-700 w-full font-bold">
                    <option value="S">南下/東向</option>
                    <option value="N">北上/西向</option>
                </select>
            </div>
            <div>
                <label class="text-slate-400 block mb-1">時速 (km/h)</label>
                <input id="sim-speed" type="number" value="100" class="bg-slate-900 text-white p-1.5 rounded border border-slate-700 w-full font-mono font-bold text-center">
            </div>
        </div>
    </div>

    <!-- 頁尾狀態列與模擬測試開關 -->
    <footer class="flex justify-between items-center text-xs text-slate-500 pt-1 pb-1 px-1">
        <span id="status-text">請允許位置存取以啟動即時追蹤</span>
        <button onclick="toggleSimulation()" id="sim-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center">
            🎮 模擬行車: OFF
        </button>
    </footer>

    <script>
        const routesDatabase = {
            "國1": { name: "國1", express: false, nodes: [
                { "id": "34", "freeway": "國道1號", "name": "高公局", "direction": "S", "km": 34.1, "lat": 25.053, "lng": 121.430, "segmentSpeed": 78 },
                { "id": "41", "freeway": "國道1號", "name": "林口", "direction": "S", "km": 41.5, "lat": 25.068, "lng": 121.364, "segmentSpeed": 92 },
                { "id": "49", "freeway": "國道1號", "name": "桃園", "direction": "S", "km": 49.1, "lat": 25.034, "lng": 121.298, "segmentSpeed": 85 },
                { "id": "52", "freeway": "國道1號", "name": "機場系統", "direction": "S", "km": 52.5, "lat": 25.031, "lng": 121.282, "segmentSpeed": 85 },
                { "id": "57", "freeway": "國道1號", "name": "中壢", "direction": "S", "km": 57.0, "lat": 24.981, "lng": 121.242, "segmentSpeed": 88 },
                { "id": "57N", "freeway": "國道1號", "name": "中壢", "direction": "N", "km": 57.0, "lat": 24.981, "lng": 121.242, "segmentSpeed": 88 },
                { "id": "52N", "freeway": "國道1號", "name": "機場系統", "direction": "N", "km": 52.5, "lat": 25.031, "lng": 121.282, "segmentSpeed": 85 },
                { "id": "49N", "freeway": "國道1號", "name": "桃園", "direction": "N", "km": 49.1, "lat": 25.034, "lng": 121.298, "segmentSpeed": 85 },
                { "id": "41N", "freeway": "國道1號", "name": "林口", "direction": "N", "km": 41.5, "lat": 25.068, "lng": 121.364, "segmentSpeed": 92 },
                { "id": "34N", "freeway": "國道1號", "name": "高公局", "direction": "N", "km": 34.1, "lat": 25.053, "lng": 121.430, "segmentSpeed": 78 }
            ]},
            "國3": { name: "國3", express: false, nodes: [
                { "id": "15", "freeway": "國道3號", "name": "南港", "direction": "S", "km": 15.1, "lat": 25.049, "lng": 121.619, "segmentSpeed": 90 },
                { "id": "31", "freeway": "國道3號", "name": "安坑", "direction": "S", "km": 31.2, "lat": 24.965, "lng": 121.512, "segmentSpeed": 85 },
                { "id": "46", "freeway": "國道3號", "name": "樹林", "direction": "S", "km": 46.0, "lat": 24.928, "lng": 121.385, "segmentSpeed": 92 },
                { "id": "54", "freeway": "國道3號", "name": "鶯歌系統", "direction": "S", "km": 54.0, "lat": 24.935, "lng": 121.311, "segmentSpeed": 88 },
                { "id": "54N", "freeway": "國道3號", "name": "鶯歌系統", "direction": "N", "km": 54.0, "lat": 24.935, "lng": 121.311, "segmentSpeed": 88 },
                { "id": "46N", "freeway": "國道3號", "name": "樹林", "direction": "N", "km": 46.0, "lat": 24.928, "lng": 121.385, "segmentSpeed": 92 },
                { "id": "31N", "freeway": "國道3號", "name": "安坑", "direction": "N", "km": 31.2, "lat": 24.965, "lng": 121.512, "segmentSpeed": 85 },
                { "id": "15N", "freeway": "國道3號", "name": "南港", "direction": "N", "km": 15.1, "lat": 25.049, "lng": 121.619, "segmentSpeed": 90 }
            ]},
            "台64": { name: "台64", express: true, nodes: [
                { "id": "0", "freeway": "台64線", "name": "八里", "direction": "S", "km": 0.0, "lat": 25.150, "lng": 121.398, "segmentSpeed": 70 },
                { "id": "14", "freeway": "台64線", "name": "板橋", "direction": "S", "km": 14.2, "lat": 25.028, "lng": 121.470, "segmentSpeed": 65 },
                { "id": "28", "freeway": "台64線", "name": "新店", "direction": "S", "km": 28.3, "lat": 24.985, "lng": 121.540, "segmentSpeed": 75 },
                { "id": "28N", "freeway": "台64線", "name": "新店", "direction": "N", "km": 28.3, "lat": 24.985, "lng": 121.540, "segmentSpeed": 75 },
                { "id": "14N", "freeway": "台64線", "name": "板橋", "direction": "N", "km": 14.2, "lat": 25.028, "lng": 121.470, "segmentSpeed": 65 },
                { "id": "0N", "freeway": "台64線", "name": "八里", "direction": "N", "km": 0.0, "lat": 25.150, "lng": 121.398, "segmentSpeed": 70 }
            ]}
        };

        let currentRouteKey = "國1";
        let isSimulation = false;
        let simInterval = null;
        let simLat = 25.068;
        let simLng = 121.364;

        function getDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function updateRouteBadge(rKey) {
            currentRouteKey = rKey;
            const rData = routesDatabase[currentRouteKey];
            const badge = document.getElementById("route-badge");
            badge.innerText = rData.name;
            badge.className = `${rData.express ? 'bg-[#C00000]' : 'bg-[#007A3D]'} text-white font-black px-3 py-1 rounded-xl text-base tracking-wider shadow border border-white/80`;
        }

        function autoDetectRoute(lat, lng) {
            if (isSimulation) return; // 模擬模式由使用者指定道路
            let bestRoute = currentRouteKey;
            let minMinDist = 999;

            Object.keys(routesDatabase).forEach(rKey => {
                const nodes = routesDatabase[rKey].nodes;
                nodes.forEach(node => {
                    const dist = getDistanceKM(lat, lng, node.lat, node.lng);
                    if (dist < minMinDist) {
                        minMinDist = dist;
                        bestRoute = rKey;
                    }
                });
            });

            if (bestRoute !== currentRouteKey && minMinDist < 5.0) {
                updateRouteBadge(bestRoute);
            }
        }

        function processLocationUpdate(lat, lng, heading, speed, forceDirection = null) {
            document.getElementById("current-speed").innerText = speed;
            autoDetectRoute(lat, lng);

            let currentDirection = forceDirection;
            if (!currentDirection) {
                currentDirection = (heading !== null && !isNaN(heading) && heading >= 90 && heading <= 270) ? "S" : "N";
            }
            document.getElementById("direction-tag").innerText = currentDirection === "S" ? "南下/東向" : "北上/西向";

            const activeData = routesDatabase[currentRouteKey].nodes.filter(item => item.direction === currentDirection);
            if (activeData.length === 0) return;

            let nearest = activeData[0];
            let minDistance = getDistanceKM(lat, lng, nearest.lat, nearest.lng);

            activeData.forEach(item => {
                const d = getDistanceKM(lat, lng, item.lat, item.lng);
                if (d < minDistance) {
                    minDistance = d;
                    nearest = item;
                }
            });

            let currentKM = nearest.km;
            if (currentDirection === "S") {
                currentKM = (lat < nearest.lat) ? (nearest.km + minDistance) : (nearest.km - minDistance);
            } else {
                currentKM = (lat > nearest.lat) ? (nearest.km - minDistance) : (nearest.km + minDistance);
            }
            currentKM = Math.max(0, currentKM);

            document.getElementById("current-km").innerText = `${currentKM.toFixed(1)} K`;

            let upcoming = [];
            if (currentDirection === "S") {
                upcoming = activeData.filter(item => item.km > currentKM).sort((a, b) => a.km - b.km);
            } else {
                upcoming = activeData.filter(item => item.km < currentKM).sort((a, b) => b.km - a.km);
            }

            renderTimelineUI(upcoming, currentKM, activeData);
        }

        // 🎮 開啟/關閉模擬面板
        function toggleSimulation() {
            isSimulation = !isSimulation;
            const btn = document.getElementById("sim-btn");
            const panel = document.getElementById("sim-panel");

            if (isSimulation) {
                btn.innerText = "🎮 模擬行車: ON";
                btn.className = "bg-amber-600 text-white border border-amber-400 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center animate-pulse";
                panel.classList.remove("hidden");

                startSimulationLoop();
            } else {
                btn.innerText = "🎮 模擬行車: OFF";
                btn.className = "bg-slate-800 text-slate-300 border border-slate-600 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center";
                panel.classList.add("hidden");
                document.getElementById("status-text").innerText = "已恢復真實 GPS 定位";
                document.getElementById("auto-route-tag").innerText = "自動辨識";
                clearInterval(simInterval);
            }
        }

        // 啟動指定道路與方向的模擬迴圈
        function startSimulationLoop() {
            if (simInterval) clearInterval(simInterval);

            const simRoute = document.getElementById("sim-route").value;
            const simDir = document.getElementById("sim-dir").value;
            const userSpeed = parseInt(document.getElementById("sim-speed").value) || 100;

            updateRouteBadge(simRoute);
            document.getElementById("auto-route-tag").innerText = "模擬測試中";

            // 抓取該道路第一個節點座標作為起點
            const nodes = routesDatabase[simRoute].nodes.filter(n => n.direction === simDir);
            if (nodes.length > 0) {
                simLat = nodes[0].lat;
                simLng = nodes[0].lng;
            }

            const latDelta = simDir === "S" ? -0.0003 : 0.0003;
            const headingVal = simDir === "S" ? 180 : 0;

            simInterval = setInterval(() => {
                simLat += latDelta;
                simLng += (latDelta * 0.5);
                processLocationUpdate(simLat, simLng, headingVal, userSpeed, simDir);
            }, 1000);
        }

        // 監聽模擬選單變更，即時切換模擬參數
        document.getElementById("sim-route").addEventListener("change", () => { if (isSimulation) startSimulationLoop(); });
        document.getElementById("sim-dir").addEventListener("change", () => { if (isSimulation) startSimulationLoop(); });
        document.getElementById("sim-speed").addEventListener("input", () => { if (isSimulation) startSimulationLoop(); });

        // 真實 GPS 監聽
        let lastLat = null;
        let lastLng = null;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    if (isSimulation) return;

                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let heading = position.coords.heading;
                    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

                    if ((heading === null || isNaN(heading)) && lastLat !== null) {
                        const dLng = lng - lastLng;
                        const dLat = lat - lastLat;
                        if (Math.abs(dLng) > 0.0001 || Math.abs(dLat) > 0.0001) {
                            heading = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
                        }
                    }
                    lastLat = lat;
                    lastLng = lng;

                    document.getElementById("status-text").innerText = "GPS 定位正常運作中";
                    processLocationUpdate(lat, lng, heading, speed);
                },
                (error) => {
                    if (!isSimulation) document.getElementById("status-text").innerText = "無法取得 GPS 定位";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        function getSpeedTag(speed) {
            if (speed >= 80) {
                return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold">${speed} km/h</span>`;
            } else if (speed >= 50) {
                return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold">${speed} km/h (車多)</span>`;
            } else {
                return `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold animate-pulse">${speed} km/h (壅塞)</span>`;
            }
        }

        function renderTimelineUI(upcoming, currentKM, activeData) {
            const container = document.getElementById("timeline-container");
            if (upcoming.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 my-auto text-base">前方無更多閘道資訊</div>`;
                return;
            }

            const nextExit = upcoming[0];
            const prevExit = activeData.filter(i => (activeData[0].direction === 'S' ? i.km <= currentKM : i.km >= currentKM)).pop() || activeData[0];
            const displayUpcoming = upcoming.slice(0, 3);
            const isExpress = routesDatabase[currentRouteKey].express;
            const signClass = isExpress ? "express-sign" : "highway-sign";

            let html = `
                <div class="absolute left-[20px] top-3 bottom-3 w-1.5 bg-slate-700 rounded-full -translate-x-1/2"></div>
            `;

            displayUpcoming.reverse().forEach((item, revIndex) => {
                const index = displayUpcoming.length - 1 - revIndex;
                const dist = Math.abs(item.km - currentKM).toFixed(1);
                const estTime = Math.ceil(dist * 0.7);
                const isNext = index === 0;

                html += `
                    <div class="relative flex items-center justify-between z-10 my-2.5 pl-10">
                        <div class="absolute left-[20px] -translate-x-1/2 w-4 h-4 rounded-full ${isNext ? 'bg-amber-400 ring-4 ring-amber-400/30' : 'bg-slate-600'}"></div>
                        
                        <div class="flex items-center space-x-2">
                            <div class="${signClass} text-white px-3.5 py-1.5 rounded-xl font-bold flex items-center space-x-2 shadow-lg ${isNext ? 'scale-105 border-amber-300' : 'opacity-85'}">
                                <span class="text-sm font-black border-r border-white/40 pr-2 font-mono">${item.id.replace('N','')}</span>
                                <span class="text-base font-extrabold tracking-wider">${item.name}</span>
                            </div>
                            ${getSpeedTag(item.segmentSpeed || 85)}
                        </div>

                        <div class="text-right">
                            <div class="text-lg font-black ${isNext ? 'text-amber-400 font-mono' : 'text-slate-200 font-mono'}">${dist} <span class="text-xs text-slate-400">km</span></div>
                            <div class="text-xs font-bold text-slate-400">約 ${estTime} 分</div>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="relative flex items-center my-3 z-10 pl-10">
                    <div class="absolute left-[20px] -translate-x-1/2 w-5 h-5 bg-emerald-400 border-2 border-white rounded-full shadow-lg shadow-emerald-400/50 animate-pulse"></div>
                    <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-md">
                        📍 目前位置: ${currentKM.toFixed(1)} K
                    </div>
                </div>
            `;

            if (prevExit && prevExit.id !== nextExit.id) {
                html += `
                    <div class="relative flex items-center justify-between opacity-50 z-10 pt-2 border-t border-slate-700/50 pl-10">
                        <div class="absolute left-[20px] -translate-x-1/2 w-3 h-3 rounded-full bg-slate-600"></div>
                        <div class="bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1 rounded-lg text-xs font-bold">
                            ${prevExit.name} (已過)
                        </div>
                        <div class="text-xs font-bold text-slate-400 font-mono">${prevExit.km.toFixed(1)} K</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        requestWakeLock();
    </script>
</body>
</html>
