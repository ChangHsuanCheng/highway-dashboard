    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .highway-sign {
            background-color: #007A3D;
            border: 2px solid #FFFFFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
        .express-sign {
            background-color: #C00000;
            border: 2px solid #FFFFFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
        .gate-row {
            height: 70px;
        }
    </style>

                </div>
                <div id="current-km" class="text-3xl md:text-4xl font-black text-emerald-400 font-mono tracking-tight">--.- K</div>
            </div>
        </div>
        <div class="text-right flex items-baseline space-x-1 bg-slate-900 px-4 py-1.5 rounded-xl border border-slate-700">
            <span id="current-speed" class="text-3xl font-black text-white font-mono">0</span>
            <span class="text-xs font-bold text-slate-400">km/h</span>
        </div>
    </header>

    <main class="flex-1 bg-[#1e293b]/90 border border-slate-700/80 rounded-2xl p-4 shadow-2xl flex flex-col justify-between relative overflow-hidden min-h-[380px]">
        
        <div class="text-xs font-bold text-slate-400 tracking-wider border-b border-slate-700/60 pb-2 flex justify-between items-center z-10 shrink-0">

                <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                <span id="api-status-text">TDX 即時路況連線中...</span>
            </span>
            <span id="direction-tag" class="bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-0.5 rounded-md text-xs font-bold">自動辨識方向</span>
        </div>

        <div id="timeline-container" class="relative flex-1 my-2 flex flex-col justify-end overflow-hidden h-[260px]">
            <div class="absolute left-[18px] top-0 bottom-[40px] w-1.5 bg-slate-700/80 rounded-full -translate-x-1/2 z-0"></div>

            <div id="scroll-track" class="relative z-10 w-full transition-transform duration-200 ease-linear">
                <div class="text-center text-slate-500 my-auto text-base">搜尋 GPS 定位中...</div>
            </div>

            <div class="relative z-20 mt-auto pt-2 border-t-4 border-emerald-500 flex flex-col items-start pl-9 justify-center bg-[#1e293b]/95 shrink-0">
                <div class="bg-emerald-950/95 border border-emerald-500/80 text-emerald-300 px-3.5 py-1.5 rounded-xl shadow-2xl leading-tight max-w-full truncate">
                    <div id="bottom-info-main" class="text-emerald-300 font-black text-xs md:text-sm tracking-wide truncate">📍 目前位置: -- K</div>
                    <div id="bottom-info-sub" class="text-[10px] text-emerald-400/90 font-bold mt-0.5 truncate">距下個出口 -- km</div>
                </div>
            </div>
        </div>

    </main>

            } else {
                return directionCode === "S" ? "東向" : "西向";
            }
        }

        async function fetchRealtimeTraffic() {
            try {
                const tdxRawUrl = "https://tdx.transportdata.tw/api/basic/v2/Road/Highway/Live/Freeway/Freeway1?%24format=JSON";
                const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(tdxRawUrl);
                const response = await fetch(proxyUrl, { method: 'GET' });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.FreewayLives) {
                        data.FreewayLives.forEach(live => {
                            if (live.CongestionLevel) {
                                const matchNode = routesDatabase["國1"].nodes.find(n => n.id === String(live.SectionID));
                                if (matchNode && live.AvgSpeed) {
                                    matchNode.segmentSpeed = Math.round(live.AvgSpeed);
                                }
                            }
                        });
                    }
                    document.getElementById("api-status-text").innerText = "TDX 實時路況已連線";
                    document.getElementById("api-status-dot").className = "w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-pulse";
                }
            } catch (err) {
                document.getElementById("api-status-text").innerText = "即時路況運作中";
                document.getElementById("api-status-dot").className = "w-2.5 h-2.5 rounded-full bg-emerald-400 mr-2";
            }
        }
        fetchRealtimeTraffic();
        setInterval(fetchRealtimeTraffic, 120000);

        function getDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

            const badge = document.getElementById("route-badge");
            badge.innerText = rData.name;
            badge.className = `${rData.express ? 'bg-[#C00000]' : 'bg-[#007A3D]'} text-white font-black px-3 py-1 rounded-xl text-base tracking-wider shadow border border-white/80`;
            
            const simDirSelect = document.getElementById("sim-dir");
            if (rData.type === "NS") {
                simDirSelect.innerHTML = `<option value="S">南下</option><option value="N">北上</option>`;
            } else {
                simDirSelect.innerHTML = `<option value="S">東向</option><option value="N">西向</option>`;
            }
            lastBuiltRouteKey = null;
        }

        function autoDetectRoute(lat, lng) {
            if (isSimulation) return;
            let bestRoute = currentRouteKey;
            let minMinDist = 999;

            Object.keys(routesDatabase).forEach(rKey => {
                const nodes = routesDatabase[rKey].nodes;
                nodes.forEach(node => {
                    const dist = getDistanceKM(lat, lng, node.lat, node.lng);
                    if (dist < minMinDist) {
                        minMinDist = dist;
                        bestRoute = rKey;
                    }
                });
            });

            if (bestRoute !== currentRouteKey && minMinDist < 5.0) {
                updateRouteBadge(bestRoute);
            }
        }

        function updateUIByKM(currentKM, speed, direction) {
            document.getElementById("current-speed").innerText = speed;
            document.getElementById("direction-tag").innerText = getDirectionText(currentRouteKey, direction);
            document.getElementById("current-km").innerText = `${currentKM.toFixed(1)} K`;

            const activeData = routesDatabase[currentRouteKey].nodes.filter(item => item.direction === direction);
            if (activeData.length === 0) return;

            renderTimelineUI(currentKM, activeData, direction);
        }

        function processLocationUpdate(lat, lng, heading, speed) {
            autoDetectRoute(lat, lng);
            let direction = (heading !== null && !isNaN(heading) && heading >= 90 && heading <= 270) ? "S" : "N";

            const activeData = routesDatabase[currentRouteKey].nodes.filter(item => item.direction === direction);
            if (activeData.length === 0) return;

            let nearest = activeData[0];
            let minDistance = getDistanceKM(lat, lng, nearest.lat, nearest.lng);

            activeData.forEach(item => {
                const d = getDistanceKM(lat, lng, item.lat, item.lng);
                if (d < minDistance) {
                    minDistance = d;
                    nearest = item;
                }
            });

            let currentKM = nearest.km;
            if (direction === "S") {
                currentKM = (lat < nearest.lat) ? (nearest.km + minDistance) : (nearest.km - minDistance);
            } else {
                currentKM = (lat > nearest.lat) ? (nearest.km - minDistance) : (nearest.km + minDistance);
            }
            currentKM = Math.max(0, currentKM);

            updateUIByKM(currentKM, speed, direction);
        }

        function toggleSimulation() {
            isSimulation = !isSimulation;
            const btn = document.getElementById("sim-btn");
            const panel = document.getElementById("sim-panel");

            if (isSimulation) {
                btn.innerText = "🎮 模擬行車: ON";
                btn.className = "bg-amber-600 text-white border border-amber-400 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center animate-pulse";
                panel.classList.remove("hidden");

                startSimulationLoop();
            } else {
                btn.innerText = "🎮 模擬行車: OFF";
                btn.className = "bg-slate-800 text-slate-300 border border-slate-600 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center";
                panel.classList.add("hidden");
                document.getElementById("status-text").innerText = "已恢復真實 GPS 定位";
                document.getElementById("auto-route-tag").innerText = "自動辨識";
                clearInterval(simInterval);
            }
        }

        function startSimulationLoop() {
            if (simInterval) clearInterval(simInterval);

            const simRoute = document.getElementById("sim-route").value;
            const simDir = document.getElementById("sim-dir").value;
            
            updateRouteBadge(simRoute);
            document.getElementById("auto-route-tag").innerText = "全線模擬中";

            const nodes = routesDatabase[simRoute].nodes.filter(n => n.direction === simDir);
            if (nodes.length > 0) {
                simCurrentKM = nodes[0].km;
            }

            simInterval = setInterval(() => {
                const userSpeed = parseInt(document.getElementById("sim-speed").value) || 120;
                const kmPerUpdate = (userSpeed / 3600) * 0.2;

                if (simDir === "S") {
                    simCurrentKM += kmPerUpdate;
                    const maxKM = nodes[nodes.length - 1].km;
                    if (simCurrentKM > maxKM) simCurrentKM = nodes[0].km;
                } else {
                    simCurrentKM -= kmPerUpdate;
                    const minKM = nodes[nodes.length - 1].km;
                    if (simCurrentKM < minKM) simCurrentKM = nodes[0].km;
                }

                updateUIByKM(simCurrentKM, userSpeed, simDir);
                document.getElementById("status-text").innerText = `全線物理推進中 (${userSpeed} km/h) | 每秒前進 ${(userSpeed/3.6).toFixed(1)} 米`;
            }, 200);
        }

        document.getElementById("sim-route").addEventListener("change", () => {
            updateRouteBadge(document.getElementById("sim-route").value);
            if (isSimulation) startSimulationLoop();
        });
        document.getElementById("sim-dir").addEventListener("change", () => { 
            lastBuiltRouteKey = null;
            if (isSimulation) startSimulationLoop(); 
        });

        updateRouteBadge("國1");

        let lastLat = null;
        let lastLng = null;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    if (isSimulation) return;

                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let heading = position.coords.heading;
                    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

                    if ((heading === null || isNaN(heading)) && lastLat !== null) {
                        const dLng = lng - lastLng;
                        const dLat = lat - lastLat;
                        if (Math.abs(dLng) > 0.0001 || Math.abs(dLat) > 0.0001) {
                            heading = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
                        }
                    }
                    lastLat = lat;
                    lastLng = lng;

                    document.getElementById("status-text").innerText = "GPS 定位正常運作中";
                    processLocationUpdate(lat, lng, heading, speed);
                },
                (error) => {
                    if (!isSimulation) document.getElementById("status-text").innerText = "無法取得 GPS 定位";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        function getSpeedTag(speed) {
            if (speed >= 80) {
                return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold">${speed} km/h</span>`;
            } else if (speed >= 50) {
                return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold">${speed} km/h (車多)</span>`;
            } else {
                return `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded text-xs font-mono font-bold animate-pulse">${speed} km/h (壅塞)</span>`;
            }
        }

        function buildFullRouteDOM(activeNodes) {
            const track = document.getElementById("scroll-track");
            const isExpress = routesDatabase[currentRouteKey].express;
            const signClass = isExpress ? "express-sign" : "highway-sign";

            let html = "";
            activeNodes.forEach(item => {
                html += `
                    <div id="gate-card-${item.id}" class="gate-row grid grid-cols-[36px_1fr_auto] items-center relative transition-opacity duration-300">
                        <div class="relative h-full flex items-center justify-center">
                            <div id="gate-dot-${item.id}" class="w-4 h-4 rounded-full z-10 bg-slate-600"></div>
                        </div>

                        <div class="flex items-center space-x-2 overflow-hidden pl-1">
                            <div class="${signClass} text-white px-3 py-1.5 rounded-xl font-bold flex items-center space-x-2 shadow-lg">
                                <span class="text-xs md:text-sm font-black border-r border-white/40 pr-1.5 font-mono">${item.id.replace('N','')}</span>
                                <span class="text-sm md:text-base font-extrabold tracking-wider whitespace-nowrap break-keep">${item.name}</span>
                            </div>
                            ${getSpeedTag(item.segmentSpeed || 85)}
                        </div>

                        <div class="text-right pl-2 shrink-0">
                            <div id="gate-dist-${item.id}" class="text-lg font-black text-slate-200 font-mono">-- <span class="text-xs text-slate-400">km</span></div>
                            <div id="gate-time-${item.id}" class="text-xs font-bold text-slate-400">--</div>
                        </div>
                    </div>
                `;
            });
            track.innerHTML = html;
        }

        function renderTimelineUI(currentKM, activeData, direction) {
            if (lastBuiltRouteKey !== currentRouteKey || lastBuiltDirection !== direction) {
                const sortedNodes = [...activeData].sort((a, b) => {
                    return direction === "S" ? b.km - a.km : a.km - b.km;
                });
                buildFullRouteDOM(sortedNodes);
                lastBuiltRouteKey = currentRouteKey;
                lastBuiltDirection = direction;
            }

            let upcoming = [];
            if (direction === "S") {
                upcoming = activeData.filter(item => item.km > currentKM).sort((a, b) => a.km - b.km);
            } else {
                upcoming = activeData.filter(item => item.km < currentKM).sort((a, b) => b.km - a.km);
            }

            if (upcoming.length === 0) return;

            const nextExit = upcoming[0];
            const prevExit = activeData.filter(i => (direction === 'S' ? i.km <= currentKM : i.km >= currentKM)).pop() || activeData[0];

            const segmentTotal = Math.abs(nextExit.km - prevExit.km) || 1;
            const segmentProgress = Math.abs(currentKM - prevExit.km);
            const progressRatio = Math.min(1.0, Math.max(0.0, segmentProgress / segmentTotal));

            const sortedNodes = [...activeData].sort((a, b) => {
                return direction === "S" ? b.km - a.km : a.km - b.km;
            });

            const nextIndex = sortedNodes.findIndex(n => n.id === nextExit.id);
            const totalNodesCount = sortedNodes.length;

            const cardHeight = 70;
            const targetY = -((nextIndex - (totalNodesCount - 3)) * cardHeight) + (progressRatio * cardHeight) + LINE_OFFSET_PX;

            sortedNodes.forEach((item) => {
                const cardEl = document.getElementById(`gate-card-${item.id}`);
                const distEl = document.getElementById(`gate-dist-${item.id}`);
                const timeEl = document.getElementById(`gate-time-${item.id}`);
                const dotEl = document.getElementById(`gate-dot-${item.id}`);

                if (!cardEl) return;

                const distVal = Math.abs(item.km - currentKM);
                const estTime = Math.ceil(distVal * 0.7);

                distEl.innerHTML = `${distVal.toFixed(1)} <span class="text-xs text-slate-400">km</span>`;
                timeEl.innerText = `約 ${estTime} 分`;

                const isNext = item.id === nextExit.id;
                const isPassed = (direction === 'S' ? item.km <= currentKM : item.km >= currentKM);

                if (isNext) {
                    dotEl.className = "w-4 h-4 rounded-full z-10 bg-amber-400 ring-4 ring-amber-400/30";
                    distEl.className = "text-lg font-black text-amber-400 font-mono";
                    cardEl.style.opacity = "1";
                } else if (isPassed) {
                    dotEl.className = "w-4 h-4 rounded-full z-10 bg-slate-700";
                    distEl.className = "text-lg font-black text-slate-500 font-mono";
                    cardEl.style.opacity = "0.15";
                } else {
                    dotEl.className = "w-4 h-4 rounded-full z-10 bg-slate-600";
                    distEl.className = "text-lg font-black text-slate-200 font-mono";
                    cardEl.style.opacity = "1";
                }
            });

            const track = document.getElementById("scroll-track");
            track.style.transform = `translateY(${targetY}px)`;

            const dirLabel = getDirectionText(currentRouteKey, direction);
            document.getElementById("bottom-info-main").innerText = `📍 目前位置: ${currentKM.toFixed(2)} K (${dirLabel})`;
            document.getElementById("bottom-info-sub").innerText = `距下個出口 (${nextExit.name}) ${Math.abs(nextExit.km - currentKM).toFixed(2)} km`;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        requestWakeLock();
    </script>
</body>
</html>
