<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>國道路況儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-[#121824] text-white min-h-screen flex flex-col p-4 justify-between select-none">

    <!-- 頂部資訊列：縮小後的時速與當前 K 數 -->
    <header class="bg-[#1a2332] border border-gray-700/50 rounded-2xl p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-green-600 text-white font-black px-2.5 py-1 rounded-lg flex items-center text-sm shadow">
                <span class="mr-1">🌸</span> 國1
            </div>
            <div>
                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">目前位置</div>
                <div id="current-km" class="text-2xl font-black text-green-400 font-mono">--.- K</div>
            </div>
        </div>
        <div class="text-right flex items-baseline space-x-1">
            <span id="current-speed" class="text-3xl font-black text-white">0</span>
            <span class="text-xs font-bold text-gray-400">km/h</span>
        </div>
    </header>

    <!-- 主體：國道路線軸 (Timeline) 風格 -->
    <main class="my-auto py-4 flex-1 flex flex-col justify-center">
        <div class="bg-[#1a2332]/80 border border-gray-700/60 rounded-3xl p-5 shadow-2xl backdrop-blur relative overflow-hidden">
            
            <div class="text-center text-xs font-bold text-gray-400 tracking-wider mb-4 border-b border-gray-700/50 pb-2 flex justify-between px-2">
                <span>前方路況與閘道資訊</span>
                <span id="direction-tag" class="text-blue-400">南下順向</span>
            </div>

            <!-- 垂直動態路線清單容器 -->
            <div id="timeline-container" class="relative space-y-3">
                <div class="text-center text-gray-500 py-8 text-sm">搜尋 GPS 定位中...</div>
            </div>

        </div>
    </main>

    <!-- 頁尾狀態列 -->
    <footer class="text-center text-[11px] text-gray-500 pb-2">
        <span id="status-text">請允許位置存取以啟動即時追蹤</span>
    </footer>

    <!-- 邏輯腳本 -->
    <script>
        // 交流道資料庫
        const highwayData = [
            { "id": "34", "freeway": "國道1號", "name": "高公局", "direction": "S", "km": 34.1, "lat": 25.053, "lng": 121.430 },
            { "id": "35", "freeway": "國道1號", "name": "泰山轉接道", "direction": "S", "km": 35.8, "lat": 25.057, "lng": 121.420 },
            { "id": "41", "freeway": "國道1號", "name": "林口", "direction": "S", "km": 41.5, "lat": 25.068, "lng": 121.364 },
            { "id": "49", "freeway": "國道1號", "name": "桃園", "direction": "S", "km": 49.1, "lat": 25.034, "lng": 121.298 },
            { "id": "52", "freeway": "國道1號", "name": "機場系統", "direction": "S", "km": 52.5, "lat": 25.031, "lng": 121.282 },
            { "id": "57", "freeway": "國道1號", "name": "中壢", "direction": "S", "km": 57.0, "lat": 24.981, "lng": 121.242 },
            { "id": "69", "freeway": "國道1號", "name": "楊梅", "direction": "S", "km": 69.2, "lat": 24.908, "lng": 121.147 },

            { "id": "69N", "freeway": "國道1號", "name": "楊梅", "direction": "N", "km": 69.2, "lat": 24.908, "lng": 121.147 },
            { "id": "57N", "freeway": "國道1號", "name": "中壢", "direction": "N", "km": 57.0, "lat": 24.981, "lng": 121.242 },
            { "id": "52N", "freeway": "國道1號", "name": "機場系統", "direction": "N", "km": 52.5, "lat": 25.031, "lng": 121.282 },
            { "id": "49N", "freeway": "國道1號", "name": "桃園", "direction": "N", "km": 49.1, "lat": 25.034, "lng": 121.298 },
            { "id": "41N", "freeway": "國道1號", "name": "林口", "direction": "N", "km": 41.5, "lat": 25.068, "lng": 121.364 },
            { "id": "35N", "freeway": "國道1號", "name": "泰山轉接道", "direction": "N", "km": 35.8, "lat": 25.057, "lng": 121.420 },
            { "id": "34N", "freeway": "國道1號", "name": "高公局", "direction": "N", "km": 34.1, "lat": 25.053, "lng": 121.430 }
        ];

        function getDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        let lastLat = null;
        let lastLng = null;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let heading = position.coords.heading;
                    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

                    document.getElementById("current-speed").innerText = speed;

                    if ((heading === null || isNaN(heading)) && lastLat !== null) {
                        const dLng = lng - lastLng;
                        const dLat = lat - lastLat;
                        if (Math.abs(dLng) > 0.0001 || Math.abs(dLat) > 0.0001) {
                            heading = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
                        }
                    }
                    lastLat = lat;
                    lastLng = lng;

                    let currentDirection = "S";
                    if (heading !== null && !isNaN(heading)) {
                        currentDirection = (heading >= 90 && heading <= 270) ? "S" : "N";
                    }

                    document.getElementById("direction-tag").innerText = currentDirection === "S" ? "南下" : "北上";

                    const activeData = highwayData.filter(item => item.direction === currentDirection);
                    let nearest = activeData[0];
                    let minDistance = getDistanceKM(lat, lng, nearest.lat, nearest.lng);

                    activeData.forEach(item => {
                        const d = getDistanceKM(lat, lng, item.lat, item.lng);
                        if (d < minDistance) {
                            minDistance = d;
                            nearest = item;
                        }
                    });

                    let currentKM = nearest.km;
                    if (currentDirection === "S") {
                        currentKM = (lat < nearest.lat) ? (nearest.km + minDistance) : (nearest.km - minDistance);
                    } else {
                        currentKM = (lat > nearest.lat) ? (nearest.km - minDistance) : (nearest.km + minDistance);
                    }
                    currentKM = Math.max(0, currentKM);

                    document.getElementById("current-km").innerText = `${currentKM.toFixed(1)} K`;
                    document.getElementById("status-text").innerText = "GPS 定位正常運作中";

                    // 篩選前方交流道 (顯示前 4 個)
                    let upcoming = [];
                    if (currentDirection === "S") {
                        upcoming = activeData.filter(item => item.km > currentKM).sort((a, b) => a.km - b.km);
                    } else {
                        upcoming = activeData.filter(item => item.km < currentKM).sort((a, b) => b.km - a.km);
                    }

                    renderTimelineUI(upcoming, currentKM);
                },
                (error) => {
                    document.getElementById("status-text").innerText = "無法取得 GPS 定位";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // 渲染路線軸介面
        function renderTimelineUI(upcoming, currentKM) {
            const container = document.getElementById("timeline-container");
            if (upcoming.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-6">前方無更多閘道資訊</div>`;
                return;
            }

            const displayList = upcoming.slice(0, 4);
            let html = `<div class="relative pl-6 space-y-6 before:absolute before:left-3.5 before:top-3 before:bottom-3 before:w-1 before:bg-gray-700/80">`;

            displayList.forEach((item, index) => {
                const dist = Math.abs(item.km - currentKM).toFixed(1);
                const estTime = Math.ceil(dist * 0.7); // 粗略估算時間
                const isNext = index === 0;

                html += `
                    <div class="relative flex items-center justify-between">
                        <!-- 路線軸上的節點圓點 -->
                        <div class="absolute -left-6 w-3.5 h-3.5 rounded-full ${isNext ? 'bg-amber-400 ring-4 ring-amber-400/30' : 'bg-gray-600'}"></div>
                        
                        <!-- 左側：黃底出口標牌 -->
                        <div class="flex items-center space-x-2 bg-amber-400 text-black px-3 py-1.5 rounded-xl font-bold shadow-md">
                            <span class="text-sm font-black border-r border-black/30 pr-2">${item.id.replace('N','')}</span>
                            <span class="text-base font-extrabold tracking-wide">${item.name}</span>
                        </div>

                        <!-- 右側：距離與預估時間 -->
                        <div class="text-right">
                            <div class="text-lg font-black ${isNext ? 'text-amber-400 font-mono' : 'text-gray-200 font-mono'}">${dist} <span class="text-xs text-gray-400">km</span></div>
                            <div class="text-[11px] font-bold text-gray-400">約 ${estTime} 分鐘</div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // 螢幕防休眠
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        requestWakeLock();
    </script>
</body>
</html>
