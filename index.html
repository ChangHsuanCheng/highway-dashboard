<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>國道路況儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .highway-sign {
            background-color: #007A3D;
            border: 2px solid #FFFFFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col p-4 justify-between select-none">

    <!-- 頂部資訊列 -->
    <header class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 flex justify-between items-center shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="bg-[#007A3D] border border-white/80 text-white font-black px-2.5 py-1 rounded-lg text-sm tracking-wider shadow">
                國1
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">目前位置</div>
                <div id="current-km" class="text-2xl font-black text-emerald-400 font-mono">--.- K</div>
            </div>
        </div>
        <div class="text-right flex items-baseline space-x-1 bg-slate-900/90 px-3.5 py-1.5 rounded-xl border border-slate-700/50">
            <span id="current-speed" class="text-2xl font-black text-white font-mono">0</span>
            <span class="text-xs font-bold text-slate-400">km/h</span>
        </div>
    </header>

    <!-- 主體：動態路線與即時車速卡片 -->
    <main class="my-auto py-4 flex-1 flex flex-col justify-center">
        <div class="bg-[#1e293b]/90 border border-slate-700/80 rounded-3xl p-5 shadow-2xl backdrop-blur relative overflow-hidden">
            
            <div class="text-center text-xs font-bold text-slate-400 tracking-wider mb-4 border-b border-slate-700/60 pb-2.5 flex justify-between items-center px-1">
                <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>前方即時路況</span>
                <span id="direction-tag" class="bg-blue-600/30 text-blue-400 border border-blue-500/30 px-2.5 py-0.5 rounded-md text-[11px] font-bold">南下</span>
            </div>

            <!-- 動態進度軌道與交流道清單 -->
            <div id="timeline-container" class="relative pl-7 space-y-5">
                <div class="text-center text-slate-500 py-8 text-sm">搜尋 GPS 定位中...</div>
            </div>

        </div>
    </main>

    <!-- 頁尾狀態列 -->
    <footer class="text-center text-[11px] text-slate-500 pb-1">
        <span id="status-text">請允許位置存取以啟動即時追蹤</span>
    </footer>

    <script>
        // 含模擬即時車速 (trafficSpeed) 的交流道資料庫
        const highwayData = [
            { "id": "34", "freeway": "國道1號", "name": "高公局", "direction": "S", "km": 34.1, "lat": 25.053, "lng": 121.430, "trafficSpeed": 88 },
            { "id": "35", "freeway": "國道1號", "name": "泰山轉接", "direction": "S", "km": 35.8, "lat": 25.057, "lng": 121.420, "trafficSpeed": 35 }, // 壅塞範例
            { "id": "41", "freeway": "國道1號", "name": "林口", "direction": "S", "km": 41.5, "lat": 25.068, "lng": 121.364, "trafficSpeed": 62 },    // 車多範例
            { "id": "49", "freeway": "國道1號", "name": "桃園", "direction": "S", "km": 49.1, "lat": 25.034, "lng": 121.298, "trafficSpeed": 92 },
            { "id": "52", "freeway": "國道1號", "name": "機場系統", "direction": "S", "km": 52.5, "lat": 25.031, "lng": 121.282, "trafficSpeed": 85 },
            { "id": "57", "freeway": "國道1號", "name": "中壢", "direction": "S", "km": 57.0, "lat": 24.981, "lng": 121.242, "trafficSpeed": 90 },
            
            { "id": "57N", "freeway": "國道1號", "name": "中壢", "direction": "N", "km": 57.0, "lat": 24.981, "lng": 121.242, "trafficSpeed": 90 },
            { "id": "52N", "freeway": "國道1號", "name": "機場系統", "direction": "N", "km": 52.5, "lat": 25.031, "lng": 121.282, "trafficSpeed": 85 },
            { "id": "49N", "freeway": "國道1號", "name": "桃園", "direction": "N", "km": 49.1, "lat": 25.034, "lng": 121.298, "trafficSpeed": 92 },
            { "id": "41N", "freeway": "國道1號", "name": "林口", "direction": "N", "km": 41.5, "lat": 25.068, "lng": 121.364, "trafficSpeed": 62 },
            { "id": "35N", "freeway": "國道1號", "name": "泰山轉接", "direction": "N", "km": 35.8, "lat": 25.057, "lng": 121.420, "trafficSpeed": 35 },
            { "id": "34N", "freeway": "國道1號", "name": "高公局", "direction": "N", "km": 34.1, "lat": 25.053, "lng": 121.430, "trafficSpeed": 88 }
        ];

        function getDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        let lastLat = null;
        let lastLng = null;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    let heading = position.coords.heading;
                    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

                    document.getElementById("current-speed").innerText = speed;

                    if ((heading === null || isNaN(heading)) && lastLat !== null) {
                        const dLng = lng - lastLng;
                        const dLat = lat - lastLat;
                        if (Math.abs(dLng) > 0.0001 || Math.abs(dLat) > 0.0001) {
                            heading = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
                        }
                    }
                    lastLat = lat;
                    lastLng = lng;

                    let currentDirection = "S";
                    if (heading !== null && !isNaN(heading)) {
                        currentDirection = (heading >= 90 && heading <= 270) ? "S" : "N";
                    }

                    document.getElementById("direction-tag").innerText = currentDirection === "S" ? "南下" : "北上";

                    const activeData = highwayData.filter(item => item.direction === currentDirection);
                    let nearest = activeData[0];
                    let minDistance = getDistanceKM(lat, lng, nearest.lat, nearest.lng);

                    activeData.forEach(item => {
                        const d = getDistanceKM(lat, lng, item.lat, item.lng);
                        if (d < minDistance) {
                            minDistance = d;
                            nearest = item;
                        }
                    });

                    let currentKM = nearest.km;
                    if (currentDirection === "S") {
                        currentKM = (lat < nearest.lat) ? (nearest.km + minDistance) : (nearest.km - minDistance);
                    } else {
                        currentKM = (lat > nearest.lat) ? (nearest.km - minDistance) : (nearest.km + minDistance);
                    }
                    currentKM = Math.max(0, currentKM);

                    document.getElementById("current-km").innerText = `${currentKM.toFixed(1)} K`;
                    document.getElementById("status-text").innerText = "GPS 定位正常運作中";

                    let upcoming = [];
                    if (currentDirection === "S") {
                        upcoming = activeData.filter(item => item.km > currentKM).sort((a, b) => a.km - b.km);
                    } else {
                        upcoming = activeData.filter(item => item.km < currentKM).sort((a, b) => b.km - a.km);
                    }

                    renderTimelineUI(upcoming, currentKM, activeData);
                },
                (error) => {
                    document.getElementById("status-text").innerText = "無法取得 GPS 定位";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // 根據即時車速判斷路況顏色與標籤
        function getTrafficBadge(speed) {
            if (speed >= 80) {
                return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-[11px] font-bold">${speed} km/h</span>`;
            } else if (speed >= 40) {
                return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded text-[11px] font-bold">${speed} km/h (車多)</span>`;
            } else {
                return `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded text-[11px] font-bold animate-pulse">${speed} km/h (壅塞)</span>`;
            }
        }

        function renderTimelineUI(upcoming, currentKM, activeData) {
            const container = document.getElementById("timeline-container");
            if (upcoming.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-6">前方無更多閘道資訊</div>`;
                return;
            }

            const nextExit = upcoming[0];
            const prevExit = activeData.filter(i => (activeData[0].direction === 'S' ? i.km <= currentKM : i.km >= currentKM)).pop() || activeData[0];
            
            // 計算車子在目前路段上的前進百分比 (%)
            const totalSegmentKM = Math.abs(nextExit.km - prevExit.km) || 1;
            const progressKM = Math.abs(currentKM - prevExit.km);
            let carPercent = Math.min(100, Math.max(0, (progressKM / totalSegmentKM) * 100));

            let html = `
                <!-- 路線軸背景軌道 -->
                <div class="absolute left-2.5 top-3 bottom-3 w-1 bg-slate-700/80 rounded-full"></div>

                <!-- 🚗 動態汽車 Icon (隨位置平滑移動) -->
                <div class="absolute left-0.5 w-5 h-5 bg-amber-400 rounded-full flex items-center justify-center text-black text-[10px] shadow-lg shadow-amber-400/50 transition-all duration-1000 z-10" 
                     style="top: calc(${carPercent}% * 0.7 + 10px);">
                    🚗
                </div>
            `;

            const displayList = upcoming.slice(0, 3);
            displayList.forEach((item, index) => {
                const dist = Math.abs(item.km - currentKM).toFixed(1);
                const estTime = Math.ceil(dist * 0.7);
                const isNext = index === 0;

                html += `
                    <div class="relative flex items-center justify-between z-0">
                        <!-- 節點標示 -->
                        <div class="absolute -left-7 w-3.5 h-3.5 rounded-full ${isNext ? 'bg-emerald-400 ring-4 ring-emerald-400/30' : 'bg-slate-600'}"></div>
                        
                        <!-- 國道綠標牌 + 路況車速 -->
                        <div class="flex items-center space-x-2">
                            <div class="highway-sign text-white px-3 py-1.5 rounded-xl font-bold flex items-center space-x-2 shadow-md">
                                <span class="text-xs font-black border-r border-white/40 pr-1.5 font-mono">${item.id.replace('N','')}</span>
                                <span class="text-sm font-extrabold tracking-wider">${item.name}</span>
                            </div>
                            <!-- 即時路況顏色與車速標籤 -->
                            ${getTrafficBadge(item.trafficSpeed)}
                        </div>

                        <!-- 距離與時間 -->
                        <div class="text-right">
                            <div class="text-base font-black ${isNext ? 'text-amber-400 font-mono' : 'text-slate-200 font-mono'}">${dist} <span class="text-[10px] text-slate-400">km</span></div>
                            <div class="text-[10px] font-bold text-slate-400">約 ${estTime} 分</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        requestWakeLock();
    </script>
</body>
</html>
